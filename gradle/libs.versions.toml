[versions]
junit = "6.0.2"
kotlin = "2.3.0"
rest-assured = "5.5.5"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
rest-assured-bom = { module = "io.rest-assured:rest-assured-bom", version.ref = "rest-assured" }
rest-assured = { module = "io.rest-assured:rest-assured" }
rest-assured-kotlin-extensions = { module = "io.rest-assured:kotlin-extensions" }
rest-assured-json-schema-validator = { module = "io.rest-assured:json-schema-validator" }

[bundles]
rest-assured = ["rest-assured", "rest-assured-kotlin-extensions", "rest-assured-json-schema-validator"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
